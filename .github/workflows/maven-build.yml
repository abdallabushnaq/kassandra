name: Maven Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Permissions for test checks and coverage comments
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Setup proper authentication for GitHub Packages
      - name: Setup Maven settings for GitHub Packages
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const settingsXml = `
            <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                      xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                         http://maven.apache.org/xsd/settings-1.0.0.xsd">
              <servers>
                <server>
                  <id>github</id>
                  <username>${process.env.GITHUB_ACTOR}</username>
                  <password>${process.env.PACKAGES_TOKEN}</password>
                </server>
              </servers>
            </settings>
            `;
            fs.mkdirSync('~/.m2', { recursive: true });
            fs.writeFileSync('~/.m2/settings.xml', settingsXml);

      - name: Set up JDK 25 for project
        uses: actions/setup-java@v3
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend coverage collection
        run: npm run test:frontend-coverage

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: Install Chrome driver
        run: |
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}' | cut -d. -f1)
          echo "Chrome version: $CHROME_VERSION"
          # WebDriverManager will handle chromedriver installation in your tests

      # Configure TestContainers to use Docker daemon
      - name: Configure TestContainers
        run: |
          echo "testcontainers.reuse.enable=true" > ~/.testcontainers.properties

      # Create directory for test recordings/screenshots
      - name: Create test directories
        run: |
          mkdir -p test-recordings
          mkdir -p test-results

      - name: Build with Maven (skipping tests)
        run: mvn clean -B package --file pom.xml -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Run unit and headless integration tests
        id: tests
        run: |
          mvn verify -P integration-test,frontend-coverage -Dfrontend.coverage=true -Dselenium.headless=true -Der.diagram.output=test-results/entity-relationship-diagram.svg
        env:
          # Set environment variables for headless testing
          SELENIUM_HEADLESS: "true"
          # Ensure Vaadin runs in production mode to avoid dev server issues
          # VAADIN_PRODUCTION_MODE: "true"
          # Any ports needed for your tests
          SERVER_PORT: 8080
          # Java options for memory, etc.
          MAVEN_OPTS: "-Xmx2048m"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Check coverage inputs
        id: coverage_inputs
        if: always()
        run: |
          if [ "${{ steps.tests.outcome }}" = "skipped" ] || [ -z "${{ steps.tests.outcome }}" ]; then
            echo "::notice::Coverage reports skipped because tests did not run."
            exit 0
          fi
          missing=0
          if [ -s target/jacoco.exec ] && [ -d target/classes ]; then
            echo "java=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No Java coverage data was produced."
            missing=1
          fi
          if [ -s target/frontend-coverage/raw/baseline.json ] && compgen -G 'target/frontend-coverage/browser-*.json' > /dev/null; then
            echo "typescript=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No TypeScript browser coverage data was produced."
            missing=1
          fi
          if [ "$missing" -eq 1 ] && [ "${{ steps.tests.outcome }}" = "success" ]; then
            echo "::error::Successful tests must produce both coverage reports."
            exit 1
          fi

      # Generate JaCoCo XML report
      - name: Generate coverage report
        id: coverage
        run: |
          mvn jacoco:report site -DskipTests
          test -s target/site/jacoco/jacoco.xml
        if: ${{ always() && steps.coverage_inputs.outputs.java == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      # Upload coverage reports to Codecov
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ always() && steps.coverage.outcome == 'success' }}
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: java
          disable_search: true
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}

      - name: Generate TypeScript coverage report
        id: frontend_coverage
        if: ${{ always() && steps.coverage_inputs.outputs.typescript == 'true' }}
        run: |
          npm run coverage:frontend
          test -s target/frontend-coverage/report/lcov.info
          node -e '
            const fs = require("fs");
            const summary = JSON.parse(fs.readFileSync("target/frontend-coverage/report/coverage-summary.json", "utf8")).total;
            const lines = ["## TypeScript coverage", "", "| Metric | Covered | Total | Coverage |", "| --- | ---: | ---: | ---: |"];
            for (const metric of ["lines", "statements", "functions", "branches"]) {
              const value = summary[metric];
              lines.push(`| ${metric} | ${value.covered} | ${value.total} | ${value.pct}% |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '

      - name: Upload TypeScript coverage to Codecov
        if: ${{ always() && steps.frontend_coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./target/frontend-coverage/report/lcov.info
          flags: typescript
          disable_search: true
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_ORG_TOKEN }}

      - name: Publish JaCoCo coverage
        if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'push') && steps.coverage.outcome == 'success' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          comment-type: ${{ github.event_name == 'push' && 'summary' || 'pr_comment' }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: JaCoCo Coverage Report
          update-comment: true
          continue-on-error: false

      # Add JUnit Report step to publish test results
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4
        if: always() # Always run even if the previous step fails
        with:
          report_paths: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          fail_on_failure: false
          include_passed: true
          detailed_summary: true

      # Upload test recordings and screenshots as artifacts
      - name: Upload test artifacts and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            test-recordings/
            test-results/
            target/surefire-reports/
            target/failsafe-reports/
            target/site/
            target/frontend-coverage/report/
          retention-days: 7
