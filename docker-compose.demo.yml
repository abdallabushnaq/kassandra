services:
  kassandra:
    image: ghcr.io/abdallabushnaq/kassandra:demo
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KASSANDRA_MODE: demo
      KASSANDRA_SECURITY_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/kassandra
    ports:
      - "8080:8080"
    volumes:
      - kassandra-demo-data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.6
    command: start-dev --import-realm --hostname=http://localhost:8180
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000; echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep '200 OK' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/kassandra-demo-realm.json:/opt/keycloak/data/import/kassandra-demo-realm.json:ro

volumes:
  kassandra-demo-data:
